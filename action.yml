name: unity-setup
description: A GitHub action for setting up the Unity Game Engine for CI/CD workflows.
branding:
  color: blue
  icon: download
inputs:
  version-file:
    description: 'Specify a path to search for the unity project version text file. Useful if there are multiple projects in a single repo. Pass `None` if creating a new project to skip file search.'
    required: false
    default: ''
  unity-version:
    description: 'Specify the Unity version(s) to install. Unity 6 (`6000`) or newer. example: `6000.2.1f1 (c7b5465681fb)`. ***This will override any version specified in the `version-file`!***'
    required: false
    default: ''
  build-targets:
    description: 'Specify the build targets to install modules for. One or more of `StandaloneWindows64` `WSAPlayer` `StandaloneOSX` `iOS` `StandaloneLinux64` `Android` `WebGL` `VisionOS`.'
    required: false
    default: ''
  modules:
    description: 'Modules to install with the editor. This list can be different per editor version.'
    required: false
    default: ''
  architecture:
    description: 'Specify the architecture to install. Either `x86_64` or `arm64`.'
    required: false
    default: ''
  install-path:
    description: 'Specify the path where Unity will be installed to.'
    required: false
  unity-cli-version:
    description: 'The version of the official Unity CLI to install, such as `1.0.0-beta.14`, or `latest`. Defaults to `1.0.0-beta.14`, the version this release is tested against. A matching CLI already on the PATH is reused.'
    required: false
    default: ''
  cache-installation:
    description: 'Cache the Unity installation between workflow runs to speed up subsequent runs. Can be `true` or `false`.'
    required: false
    default: 'false'
outputs:
  unity-cli-path:
    description: 'The file path to the Unity CLI executable.'
  unity-cli-version:
    description: 'The installed Unity CLI version.'
  unity-hub-path:
    description: 'Deprecated. The file path to the Unity CLI executable, kept for workflows written against v2.'
  unity-editors:
    description: 'A JSON array of all installed Unity Editors on the runner.'
  unity-editor-path:
    description: 'The path to the latest installed version of Unity.'
  unity-project-path:
    description: 'The file path to the Unity project.'
runs:
  using: node24
  main: dist/index.js
  post: dist/index.js
